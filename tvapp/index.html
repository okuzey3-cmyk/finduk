<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sinema Odasi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#150A10;overflow:hidden;font-family:sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#ayar{display:none;position:fixed;inset:0;background:rgba(21,10,16,.96);color:#F3EADC;z-index:9;align-items:center;justify-content:center;flex-direction:column;font-size:28px}
#ayar input{font-size:32px;padding:10px 16px;margin:20px;width:420px;border-radius:10px;border:2px solid #D9A441;background:#000;color:#fff}
#ayar input:focus,#ayar button:focus{outline:4px solid #fff;outline-offset:3px}
#ayar button{font-size:28px;padding:10px 30px;border-radius:10px;border:0;background:#D9A441;color:#150A10;margin:6px}
#bildir{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#D9A441;color:#150A10;padding:12px 24px;border-radius:12px;font-size:26px;display:none;z-index:8}
</style></head><body>
<iframe id="cerceve" allow="autoplay; fullscreen"></iframe>
<div id="ayar">
  <div>Finduk'un adresini yaz (ornek 192.168.1.50)</div>
  <div style="font-size:20px;opacity:.7;margin-top:8px">Yon tuslariyla gez, Tamam ile sec, Geri ile kapat</div>
  <input id="ip" placeholder="192.168.1.50">
  <div><button id="kaydet">Kaydet</button><button id="iptal">Vazgec</button></div>
</div>
<div id="bildir"></div>
<script>
var SITE="https://okuzey3-cmyk.github.io/Sinema-Odas-/tv.html";
var cerceve=document.getElementById("cerceve"),ayar=document.getElementById("ayar"),ipk=document.getElementById("ip"),bil=document.getElementById("bildir");
function ipAl(){try{return localStorage.getItem("finduk_ip")||""}catch(e){return ""}}
function bildirGoster(m){bil.textContent=m;bil.style.display="block";setTimeout(function(){bil.style.display="none"},3500)}
var ayarAcik=false;
function cerceveOdak(){try{cerceve.focus();cerceve.contentWindow.focus()}catch(e){}}
function ayarAc(){ipk.value=ipAl();ayar.style.display="flex";ayarAcik=true;document.getElementById("kaydet").focus()}
function ayarKapat(){ayar.style.display="none";ayarAcik=false;try{ipk.blur()}catch(e){}setTimeout(cerceveOdak,50)}
var sira=[ipk,document.getElementById("kaydet"),document.getElementById("iptal")];
document.addEventListener("keydown",function(e){
  var k=e.keyCode;
  if(!ayarAcik){if(document.activeElement!==cerceve)cerceveOdak();return}
  var i=sira.indexOf(document.activeElement);
  if(k===10009||k===27){ayarKapat();e.preventDefault();return}
  if(k===13){if(i<=0){sira[1].focus()}else sira[i].click();e.preventDefault();return}
  if(document.activeElement===ipk&&(k===37||k===39))return;
  if(k===38){ipk.focus();e.preventDefault();return}
  if(k===40){if(i===0)sira[1].focus();e.preventDefault();return}
  if(k===37){sira[i===2?1:1].focus();e.preventDefault();return}
  if(k===39){sira[2].focus();e.preventDefault();return}
},true);
document.getElementById("kaydet").onclick=function(){
  var v=ipk.value.replace(/[^0-9.]/g,"");
  try{localStorage.setItem("finduk_ip",v)}catch(e){}
  ayarKapat();bildirGoster(v?"Finduk adresi kaydedildi":"Adres bos")
};
document.getElementById("iptal").onclick=function(){ayarKapat()};
window.addEventListener("message",function(ev){
  if(ev.origin!=="https://okuzey3-cmyk.github.io")return;
  var d=ev.data||{};
  if(d.tip==="finduk-ayar"){ayarAc();return}
  if(d.tip==="finduk-geri"){try{tizen.application.getCurrentApplication().exit()}catch(e){}return}
  if(d.tip!=="finduk-tv")return;
  dogrudanAc(d.platform||"",d.url||"",d.film||"",d);
});

// --- Filmi/fragmani dogrudan TV'de ac (Finduk gerekmez) ---
var BILINEN={netflix:"3201907018807",youtube:"111299001912",prime:"3201910019365",disney:"3201901017640"};
function pAnahtar(p){p=(p||"").toLowerCase();if(p.indexOf("netflix")>=0)return"netflix";if(p.indexOf("youtube")>=0)return"youtube";if(p.indexOf("prime")>=0||p.indexOf("amazon")>=0)return"prime";if(p.indexOf("disney")>=0)return"disney";if(p.indexOf("tv+")>=0||p.indexOf("turkcell")>=0||p.indexOf("tvplus")>=0)return"tv+";return p.replace(/[^a-z0-9]/g,"")}
function adlaBul(k,cb){
  try{tizen.application.getAppsInfo(function(L){
    var a=k==="tv+"?["tv+","tvplus","turkcell"]:[k==="prime"?"prime video":k];
    for(var i=0;i<L.length;i++){var n=(L[i].name||"").toLowerCase();for(var j=0;j<a.length;j++)if(n.indexOf(a[j])>=0){cb(L[i].id);return}}
    cb(null)},function(){cb(null)})}catch(e){cb(null)}
}
function kontrolAc(id,deger,uri,ok,hata){
  // GROUP: acilan uygulamadan Geri ile cikinca Sinema Odasi'na donulur
  try{
    var veri=deger?[new tizen.ApplicationControlData("PAYLOAD",[JSON.stringify({values:deger})])]:[];
    var c;
    try{c=new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/view",uri||null,null,null,veri,"GROUP")}
    catch(e){c=new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/view",uri||null,null,null,veri)}
    tizen.application.launchAppControl(c,id,ok,function(){try{tizen.application.launch(id,ok,hata)}catch(e){hata()}},{onsuccess:function(){},onfailure:function(){}});
  }catch(e){hata()}
}
function jwBul(d,plat,cb){
  if(!d||!d.tmdb||!d.baslik){cb("");return}
  var q={query:"query($c:Country!,$l:Language!,$f:TitleFilter){popularTitles(country:$c,first:6,filter:$f){edges{node{objectType content(country:$c,language:$l){externalIds{tmdbId}} offers(country:$c,platform:WEB){standardWebURL package{clearName technicalName}}}}}}",variables:{c:"TR",l:"tr",f:{searchQuery:d.baslik}}};
  var x=new XMLHttpRequest();x.open("POST","https://apis.justwatch.com/graphql");x.setRequestHeader("Content-Type","application/json");x.timeout=6000;
  x.onload=function(){try{
    var ed=JSON.parse(x.responseText).data.popularTitles.edges,tip=d.media==="tv"?"SHOW":"MOVIE",k=pAnahtar(plat);
    for(var i=0;i<ed.length;i++){var n=ed[i].node;if(!n||n.objectType!==tip||String(n.content.externalIds.tmdbId)!==String(d.tmdb))continue;
      for(var j=0;j<(n.offers||[]).length;j++){var o=n.offers[j];if(o&&o.package&&pAnahtar(o.package.clearName+" "+o.package.technicalName)===k&&o.standardWebURL){cb(o.standardWebURL);return}}}
  }catch(e){}cb("")};
  x.onerror=x.ontimeout=function(){cb("")};
  x.send(JSON.stringify(q));
}
function findukaGonder(plat,url,film){
  var ip=ipAl();
  if(!ip){bildirGoster(plat+" acilamadi");return}
  var q="url="+encodeURIComponent(url)+"&platform="+encodeURIComponent(plat)+"&film="+encodeURIComponent(film);
  fetch("http://"+ip+"/tv?"+q,{mode:"no-cors"}).catch(function(){bildirGoster("Acilamadi")});
}
function dogrudanAc(plat,url,film,d){
  var k=pAnahtar(plat);
  if(!url&&(k==="netflix"||k==="prime"||k==="disney")){jwBul(d,plat,function(u){dogrudanAc2(plat,u,film,d)});return}
  dogrudanAc2(plat,url,film,d);
}
function dogrudanAc2(plat,url,film,d){
  var k=pAnahtar(plat),deger="",uri=null;
  var y=url.indexOf("watch?v="),n=url.match(/netflix\.com\/(?:[a-z-]+\/)?title\/(\d+)/);
  if(y>=0){k="youtube";deger="v="+url.substr(y+8,11)}
  else if(n){k="netflix";deger="m="+n[1]+"&source_type=4"}
  else if(url&&(k==="prime"||k==="disney")){uri=url;deger=url}
  bildirGoster((k==="youtube"?"YouTube":plat)+(deger?" aciliyor: "+film:" aciliyor (film sayfasi bulunamadi)"));
  var dene=function(id){
    if(!id){findukaGonder(plat,url,film);return}
    kontrolAc(id,deger,uri,function(){},function(){findukaGonder(plat,url,film)});
  };
  if(BILINEN[k])dene(BILINEN[k]);else adlaBul(k,dene);
}
cerceve.onload=cerceveOdak;
cerceve.src=SITE;
</script></body></html>
