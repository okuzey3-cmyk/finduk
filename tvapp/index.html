<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sinema Odasi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#150A10;overflow:hidden;font-family:sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#ayar{display:none;position:fixed;inset:0;background:rgba(21,10,16,.96);color:#F3EADC;z-index:9;align-items:center;justify-content:center;flex-direction:column;font-size:28px}
#ayar input{font-size:32px;padding:10px 16px;margin:20px;width:420px;border-radius:10px;border:2px solid #D9A441;background:#000;color:#fff}
#ayar button{font-size:28px;padding:10px 30px;border-radius:10px;border:0;background:#D9A441;color:#150A10;margin:6px}
#bildir{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#D9A441;color:#150A10;padding:12px 24px;border-radius:12px;font-size:26px;display:none;z-index:8}
</style></head><body>
<iframe id="cerceve" allow="autoplay; fullscreen"></iframe>
<div id="ayar">
  <div>Finduk'un adresini yaz (ornek 192.168.1.50)</div>
  <input id="ip" placeholder="192.168.1.50">
  <div><button id="kaydet">Kaydet</button><button id="iptal">Vazgec</button></div>
</div>
<div id="bildir"></div>
<script>
var SITE="https://okuzey3-cmyk.github.io/Sinema-Odas-/?tv=1";
var cerceve=document.getElementById("cerceve"),ayar=document.getElementById("ayar"),ipk=document.getElementById("ip"),bil=document.getElementById("bildir");
function ipAl(){try{return localStorage.getItem("finduk_ip")||""}catch(e){return ""}}
function bildirGoster(m){bil.textContent=m;bil.style.display="block";setTimeout(function(){bil.style.display="none"},3500)}
function ayarAc(){ipk.value=ipAl();ayar.style.display="flex";ipk.focus()}
document.getElementById("kaydet").onclick=function(){
  var v=ipk.value.replace(/[^0-9.]/g,"");
  try{localStorage.setItem("finduk_ip",v)}catch(e){}
  ayar.style.display="none";bildirGoster(v?"Finduk adresi kaydedildi":"Adres bos")
};
document.getElementById("iptal").onclick=function(){ayar.style.display="none"};
window.addEventListener("message",function(ev){
  if(ev.origin!=="https://okuzey3-cmyk.github.io")return;
  var d=ev.data||{};
  if(d.tip==="finduk-ayar"){ayarAc();return}
  if(d.tip!=="finduk-tv")return;
  var ip=ipAl();
  if(!ip){ayarAc();return}
  var q="url="+encodeURIComponent(d.url||"")+"&platform="+encodeURIComponent(d.platform||"")+"&film="+encodeURIComponent(d.film||"");
  bildirGoster((d.platform||"")+" aciliyor: "+(d.film||""));
  fetch("http://"+ip+"/tv?"+q,{mode:"no-cors"}).catch(function(){bildirGoster("Finduk'a ulasilamadi, adresi kontrol et")});
});
cerceve.src=SITE;
if(!ipAl())setTimeout(ayarAc,2500);
</script></body></html>
